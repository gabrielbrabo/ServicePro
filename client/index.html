<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ServiçosPro</title>
    <meta
      name="description"
      content="Encontre profissionais perto de você e agende na hora. Agenda, caixa e gestão completa para salões, barbearias, clínicas e serviços."
    />

    <!-- icones: aba do navegador, favoritos, tela inicial do celular -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0E7C72" />
    <meta name="apple-mobile-web-app-title" content="ServiçosPro" />
    <meta name="application-name" content="ServiçosPro" />

    <!-- previa ao compartilhar o link (WhatsApp, Facebook, LinkedIn, X) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ServiçosPro" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="ServiçosPro — encontre, agende e gerencie serviços" />
    <meta
      property="og:description"
      content="Encontre profissionais perto de você e agende na hora. Gestão completa para estabelecimentos."
    />
    <meta property="og:url" content="https://servicospro.com/" />
    <meta property="og:image" content="https://servicospro.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo do ServiçosPro" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://servicospro.com/og-image.png" />
    <!-- aplica o tema salvo antes do render para nao piscar o tema errado -->
    <script>
      (function () {
        try {
          if (localStorage.getItem("servicepro:theme") === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
